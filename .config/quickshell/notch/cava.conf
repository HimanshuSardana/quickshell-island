; cava config used by the notch visualizer panel.
;
; The shell runs `cava -p <this file>` only while the visualizer is open.
; Output is one frame per line: values 0..ascii_max_range separated by ';'.
; The panel divides by ascii_max_range to get a 0..1 level per bar.
;
; Notes:
;   - comments must use ';' (inih does not accept '#')
;   - no [color] section: it is unused for raw output and makes this cava
;     build reject the file, silently falling back to noncurses.

[general]
bars = 40
framerate = 60
sensitivity = 100

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10
