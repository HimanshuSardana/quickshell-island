# CarbonFox - generated by the notch theme selector
set-option -g status-style "bg=default,fg=#be95ff"
set-option -g window-status-style "bg=default,fg=#7b7b7b"
set-option -g window-status-current-style "bg=default,fg=#be95ff,bold"
set-option -g pane-border-style "fg=#2a2a2a"
set-option -g pane-active-border-style "fg=#be95ff"
