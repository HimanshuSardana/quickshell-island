# Remap prefix to Ctrl+a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Use zsh for new panes/windows (if installed)
if-shell '[ -x /usr/bin/zsh ]' 'set-option -g default-shell /usr/bin/zsh'

# Split with | (vertical) and - (horizontal)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Keep defaults too (optional - remove if unwanted)
# % = vertical split, " = horizontal split (tmux defaults)

# Kill pane without confirmation
bind-key x kill-pane

# Reload config with prefix + r
bind-key r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Navigate panes with prefix + h/j/k/l (vim-style)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Allow image protocols (kitty graphics) to pass through tmux
set-option -g allow-passthrough on
# Kitty keyboard protocol (modified keys like Shift+Enter)
set-option -g extended-keys on

# Start window/pane numbering at 1
set-option -g base-index 1
set-window-option -g pane-base-index 1

# Status bar on top, minimal Catppuccin Mocha (transparent bg, accent text)
set-option -g status-position top
set-option -g status-style "bg=default,fg=#cba6f7"
set-option -g status-left ""
set-option -g status-right ""
set-option -g window-status-format "  #I: #W  "
set-option -g window-status-current-format "  #I: #W  "
set-option -g window-status-style "bg=default,fg=#6c7086"
set-option -g window-status-current-style "bg=default,fg=#cba6f7,bold"
set-option -g pane-border-style "fg=#313244"
set-option -g pane-active-border-style "fg=#cba6f7"

# Vim-style copy mode (prefix + [ then h/j/k/l, v, y)
set-window-option -g mode-keys vi
bind-key [ copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
